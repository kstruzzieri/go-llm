# GoReleaser v2 config. Runs on tag push via .github/workflows/release.yml.
# Both CLIs are pure Go (modernc sqlite, no CGo) so cross-compilation runs with
# CGO_ENABLED=0 from a single Linux runner.
version: 2

project_name: go-llm

before:
  hooks:
    - go mod tidy

builds:
  - id: golem
    main: ./cmd/golem
    binary: golem
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .ShortCommit }}
      - -X main.date={{ .CommitDate }}
  - id: go-llm-mcp
    main: ./cmd/go-llm-mcp
    binary: go-llm-mcp
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w

archives:
  - id: bins
    ids:
      - golem
      - go-llm-mcp
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - NOTICE
      - README.md
      - CHANGELOG.md
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

# CHANGELOG.md is curated by hand; do not let GoReleaser autogenerate one.
changelog:
  disable: true

release:
  draft: false
  prerelease: auto

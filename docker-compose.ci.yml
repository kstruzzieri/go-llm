# Fixed project name so linked worktrees share the image and cache volumes
# instead of rebuilding cold per checkout directory.
name: go-llm

services:
  ci:
    build:
      context: .
      dockerfile: Dockerfile.ci
    working_dir: /workspace
    command: ["./scripts/ci-local", "--mode", "pre-push"]
    # The image runs as uid 1000 (see Dockerfile.ci). The volume names carry a
    # -ci suffix so they are created fresh with that ownership rather than
    # reusing the root-owned volumes of the earlier image.
    volumes:
      - .:/workspace
      - go-build-cache-ci:/home/ci/.cache/go-build
      - go-mod-cache-ci:/go/pkg/mod
      - golangci-lint-cache-ci:/home/ci/.cache/golangci-lint

volumes:
  go-build-cache-ci:
  go-mod-cache-ci:
  golangci-lint-cache-ci:

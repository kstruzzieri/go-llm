name: macOS Compile Smoke

on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

# Cancel stale PR runs on new pushes; let push builds on develop/main complete
concurrency:
  group: darwin-smoke-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  darwin-smoke:
    name: macOS Compile Smoke
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Changelog script self-test
        run: ./scripts/test-changelog-fold

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Compile smoke
        run: go test -run '^$' ./...

      # Native darwin runtime coverage for background command execution
      # (#346): process-group lifecycle, manager suites, the REPL shutdown
      # paths that kill and reap real process groups, and the #481 exit
      # observer regressions (a child that exits before registration).
      - name: Background exec runtime
        run: go test -race -run 'TestBackground(Process|Manager)|TestRunBackground|TestJobs|TestProcessExitObserver' ./agent/tools ./cmd/golem

      # Workspace mutation boundary (#552) on APFS: the case/normalization
      # alias suites skip on case-sensitive Linux filesystems, and the Darwin
      # O_SEARCH / RENAME_EXCL descriptor paths differ from Linux.
      - name: Workspace mutation boundary
        run: go test -race -count=1 -run '^TestMutation' ./agent/tools ./cmd/golem

      # Credential tripwire aliases (#627) on APFS: case and Unicode fold
      # spellings of a protected directory resolve to the directory itself
      # only on a case-insensitive volume, so these cases exercise the
      # stored-spelling paths natively. Linux CI runs them too, where each
      # spelling is its own directory. Two of them skip on a volume without
      # the aliases, so a skip here fails the step instead of passing it, and
      # so does any count of passing tests other than the four (a rename
      # would otherwise run nothing and pass).
      - name: Credential tripwire aliases
        shell: bash
        run: |
          go test -race -count=1 -v -run '^TestCredentialAlias' ./agent/tools | tee "$RUNNER_TEMP/credential-alias.txt"
          if grep -q -- '--- SKIP' "$RUNNER_TEMP/credential-alias.txt"; then
            echo "::error::credential alias tests skipped: this runner volume does not alias .ssh spellings"
            exit 1
          fi
          passed=$(grep -c -- '--- PASS: TestCredentialAlias' "$RUNNER_TEMP/credential-alias.txt" || true)
          if [ "$passed" -ne 4 ]; then
            echo "::error::expected 4 passing TestCredentialAlias tests, saw $passed"
            exit 1
          fi

      # golem ops -watch on a real Darwin PTY (#654): screen and cursor
      # restored on exit, on SIGINT and on SIGTERM, frames that follow a
      # resize, and Ctrl-Z job control in helper processes, with and without
      # a job-control session. Linux CI runs the same tests. A rename would
      # match nothing and pass, so the step requires exactly the five to pass.
      - name: golem ops -watch PTY
        shell: bash
        run: |
          go test -race -count=1 -v -run '^TestOpsWatch(RealPTY|Job)' ./cmd/golem | tee "$RUNNER_TEMP/ops-watch-pty.txt"
          passed=$(grep -cE -- '^--- PASS: TestOpsWatch(RealPTY|Job)' "$RUNNER_TEMP/ops-watch-pty.txt" || true)
          if [ "$passed" -ne 5 ]; then
            echo "::error::expected 5 passing -watch PTY and job tests, saw $passed"
            exit 1
          fi

      # Real Seatbelt confinement (#442). GO_LLM_REQUIRE_SEATBELT=1 turns a
      # skip into a hard failure, so a runner that cannot apply Seatbelt (a
      # nested sandbox) fails the gate rather than silently passing. The
      # non-race pass exercises the helper-process legs (a race-instrumented
      # child cannot initialize inside the profile); the race pass covers the
      # rest under the detector.
      - name: Seatbelt confinement (non-race)
        env:
          GO_LLM_REQUIRE_SEATBELT: "1"
        run: go test -count=1 -run '^(TestSeatbelt|TestSBPL|TestProbeSeatbelt|TestScratchSeatbelt|TestNewExecBackendSeatbelt)' ./agent/tools

      - name: Seatbelt confinement (race)
        env:
          GO_LLM_REQUIRE_SEATBELT: "1"
        run: go test -race -count=1 -run '^(TestSeatbelt|TestSBPL|TestProbeSeatbelt|TestScratchSeatbelt|TestNewExecBackendSeatbelt)' ./agent/tools

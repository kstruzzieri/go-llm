name: Release

on:
  push:
    tags:
      - 'v*'

# Needed for GoReleaser to create the GitHub release and upload assets.
permissions:
  contents: write

jobs:
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned to full commit SHAs (immutable) per
      # GitHub secure-use guidance; the trailing comment records the tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # GoReleaser needs full history and tags to compute the version.
          fetch-depth: 0

      # Branch policy: releases live only on main. Reject a v* tag pushed on a
      # commit that main does not contain (a mislabeled release), since Go
      # module tags must not be moved once published. Uses the shell env var,
      # not ${{ }} interpolation, so the tag name is never eval'd.
      - name: Enforce tag is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::tag $GITHUB_REF_NAME ($GITHUB_SHA) is not contained in origin/main; releases must be tagged on a main commit"
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME is on main"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          # Exact version, kept in lockstep with the check step in ci.yml.
          version: 2.17.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

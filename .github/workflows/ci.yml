name: CI

on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

# Cancel stale PR runs on new pushes; let push builds on develop/main complete
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: CI script self-test
        run: ./scripts/test-ci-local

      - name: Changelog script self-test
        run: ./scripts/test-changelog-fold

      - name: Reject direct CHANGELOG.md edits and validate fragments
        # The fold invariant holds for PRs into develop. A release PR promotes
        # develop into main wholesale, and main never carries fragments, so the
        # folded sections look like direct edits from main's side; the fold was
        # already checked on the stamp PR into develop.
        if: github.event_name == 'pull_request' && github.base_ref != 'main'
        env:
          BASE: ${{ github.base_ref }}
        run: ./scripts/check-changelog "origin/$BASE"

      - name: Require a folded changelog on release PRs
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        # Tracked paths, so hidden entries count and a missing README fails.
        run: |
          tracked="$(git ls-files -- changelog.d)"
          if [ "$tracked" != "changelog.d/README.md" ]; then
            printf 'release PR must carry exactly changelog.d/README.md; tracked:\n%s\n' "$tracked" >&2
            exit 1
          fi

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.13.2

      - name: Format all Go files
        run: golangci-lint fmt --diff

      # Same discovery + exact-PASS + skip-allowlist gate the pre-push hook
      # runs, so a renamed, skipped, or hollowed-out aggregate cannot pass the
      # required check by bypassing the local hook. It is also the only CI run
      # that enforces the aggregate's 500 ms budget (-hardening-budget); the
      # Test step's race pass runs the same contracts without it.
      - name: Security contracts
        run: ./scripts/ci-local --mode security

      - name: Test
        run: |
          go version
          go test -race ./...

      # vet type-checks every package with its test files, so a test naming a
      # symbol declared only in a build-tagged file fails here. windows checks
      # the !unix files; freebsd is the only lane where unix holds but linux
      # and darwin do not. scripts/ci-local --mode full runs the same vets.
      - name: Cross-platform compile smoke
        env:
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          GOOS=windows go build -o /dev/null ./cmd/golem
          GOOS=windows go vet ./...
          GOOS=freebsd go vet ./...

      # Validate .goreleaser.yaml on every PR so a schema error surfaces here,
      # not at tag-push time when it would fail the actual release.
      - name: GoReleaser config check
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          # Keep in exact lockstep with .github/workflows/release.yml.
          version: 2.17.0
          args: check

  # Oldest Go this module accepts: the go.mod `go` directive's minor, pinned by
  # scripts/test-ci-local so raising the floor cannot leave this lane behind.
  # A separate job preserves the required "Lint & Test" status and runs only
  # tests; the versionless name lets branch protection require it across bumps.
  compatibility:
    name: Test (oldest supported Go)
    runs-on: ubuntu-latest
    env:
      # Use setup-go's compiler even though go.mod suggests a newer toolchain.
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.x'

      - name: Test
        run: |
          go version
          go test -race ./...

  # Real bwrap confinement (#441) on a full VM: Docker-based local CI cannot
  # create user namespaces, so this pinned runner is the behavioral gate.
  # GO_LLM_REQUIRE_BWRAP=1 turns a capability skip into a hard failure, so a
  # runner that cannot apply the sandbox fails loudly instead of passing.
  linux-sandbox:
    name: Linux Sandbox (bwrap)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Install sandbox dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            apparmor-profiles apparmor-utils bubblewrap python3-minimal util-linux

      # Ubuntu 24.04 mediates unprivileged user namespaces. noble ships this
      # profile in apparmor-profiles: it grants namespace setup only to the
      # fixed /usr/bin/bwrap TCB and keeps children restricted. Never disable
      # kernel.apparmor_restrict_unprivileged_userns globally for this gate.
      - name: Load Bubblewrap AppArmor profile when required
        run: |
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null | grep -qx 1; then
            sudo apparmor_parser -r /usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          fi

      - name: Bwrap confinement (non-race)
        env:
          GO_LLM_REQUIRE_BWRAP: "1"
        run: go test -count=1 -run '^(TestBwrap|TestBuildBwrap|TestCollectBwrap|TestProbeBwrap|TestExistingPolicyPaths)' ./agent/tools

      - name: Bwrap confinement (race)
        env:
          GO_LLM_REQUIRE_BWRAP: "1"
        run: go test -race -count=1 -run '^(TestBwrap|TestBuildBwrap|TestCollectBwrap|TestProbeBwrap|TestExistingPolicyPaths)' ./agent/tools

  # Real-CLI Agentflow suite (#577) against the one verified-compatible pin, run
  # twice: against an installed `agentflow` and against a source checkout.
  # GO_LLM_REQUIRE_AGENTFLOW turns a missing-Agentflow skip into a hard failure,
  # so a runner that cannot find Agentflow fails loudly instead of passing.
  agentflow-compat:
    name: Agentflow compatibility
    runs-on: ubuntu-24.04
    env:
      AGENTFLOW_TESTS: '^(Test.*_RealCLI($|_)|TestAgentflow(Smoke|ParallelSmoke)$)'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      # Pinned to the last Agentflow commit Golem develop is verified against.
      # Agentflow main moved to 1.0 schemas; bumping this pin is #612's job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: kstruzzieri/agentflow
          ref: 418602db857d726b4673cfab352650474743ccce
          path: _agentflow
          persist-credentials: false

      - name: Install Agentflow
        run: |
          python3 -m venv "$RUNNER_TEMP/agentflow-venv"
          "$RUNNER_TEMP/agentflow-venv/bin/pip" install ./_agentflow

      # Only this step puts the venv on PATH. The source step must run the
      # system python3, which cannot import Agentflow except from AGENTFLOW_SRC.
      - name: Agentflow compatibility (installed)
        env:
          GO_LLM_REQUIRE_AGENTFLOW: installed
        run: |
          export PATH="$RUNNER_TEMP/agentflow-venv/bin:$PATH"
          go test -tags=agentflow_integration -count=1 -run "$AGENTFLOW_TESTS" ./agentflow ./cmd/golem

      - name: Agentflow compatibility (source)
        env:
          GO_LLM_REQUIRE_AGENTFLOW: source
          AGENTFLOW_SRC: ${{ github.workspace }}/_agentflow
        run: go test -tags=agentflow_integration -count=1 -run "$AGENTFLOW_TESTS" ./agentflow ./cmd/golem

  windows-sqlite:
    name: Windows SQLite URIs
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      # Linux CI only builds and vets for Windows. This runs the SQLite URI
      # tests natively: Windows path resolution, SQLite's URI parser and the
      # Windows VFS (#619).
      - name: Test internal/sqlitedsn on Windows
        env:
          CGO_ENABLED: "0"
        run: go test -count=1 -v ./internal/sqlitedsn

name: CI

on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

# Cancel stale PR runs on new pushes; let push builds on develop/main complete
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: CI script self-test
        run: ./scripts/test-ci-local

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.11.4

      - name: Test
        run: go test -race ./...

      - name: Windows compile smoke
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          go build -o /dev/null ./cmd/golem
          go test -c -o /dev/null ./cmd/golem

      # Validate .goreleaser.yaml on every PR so a schema error surfaces here,
      # not at tag-push time when it would fail the actual release.
      - name: GoReleaser config check
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          # Keep in exact lockstep with .github/workflows/release.yml.
          version: 2.17.0
          args: check

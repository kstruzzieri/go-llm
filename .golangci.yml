version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck

# In golangci-lint v2 formatters live outside `linters`. The CI gate runs
# `golangci-lint fmt --diff` so inactive GOOS/build-tag files are checked too;
# `golangci-lint run` only reports formatter findings for loaded packages.
# `golangci-lint fmt` without `--diff` applies the fixes.
#
# simplify is spelled out because it makes this gate stricter than a bare
# `gofmt -l`: it also rejects redundant composite literal types. Leaving it
# implicit means `gofmt -l` and this gate can disagree with no record of why.
#
# goimports additionally pins import grouping and ordering, which nothing
# else here checks. Not gofumpt: its extra rules would rewrite a large
# fraction of the tree and collide with in-flight branches.
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true

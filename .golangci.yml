version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
  # unusedwrite is off in govet's default analyzer set. It catches a class
  # nothing else here does: a field assigned in a composite literal that is
  # never read back. staticcheck's SA4005/SA4006 are narrower and missed a
  # three-field instance in cmd/golem/repl.go, where a struct was built, three
  # fields set, and the struct then passed nowhere that read them.
  settings:
    govet:
      enable:
        - unusedwrite
  exclusions:
    rules:
      # unusedwrite has a high false-positive rate on test fixtures, which set
      # surrounding fields to make a literal realistic and then assert on one
      # of them. Every finding in provider/ is that shape. Rather than exclude
      # all test code, exclude only keyed composite-literal fields: `Model:
      # "x"` inside a fixture is skipped, while `resp.Model = "x"` in a test
      # helper -- the shape that is actually dead plumbing -- still reports.
      #
      # The alternation covers both fixture layouts: one field per line (the
      # `^` branch) and fields inline after `{` or `,` on a single line.
      #
      # Known blind spot: the upstream analyzer disables itself for packages
      # importing `unsafe`, so `GOOS=windows` lint runs see nothing in
      # cmd/golem (index_lease_windows.go imports it). CI lints on Ubuntu, so
      # the gate itself is unaffected.
      - path: _test\.go$
        source: '(^|[{,])[[:space:]]*[A-Za-z_][A-Za-z0-9_]*:[[:space:]]'
        text: unusedwrite
        linters:
          - govet

# In golangci-lint v2 formatters live outside `linters`. The CI gate runs
# `golangci-lint fmt --diff` so inactive GOOS/build-tag files are checked too;
# `golangci-lint run` only reports formatter findings for loaded packages.
# `golangci-lint fmt` without `--diff` applies the fixes.
#
# simplify is spelled out because it makes this gate stricter than a bare
# `gofmt -l`: it also rejects redundant composite literal types. Leaving it
# implicit means `gofmt -l` and this gate can disagree with no record of why.
#
# goimports additionally pins import grouping and ordering, which nothing
# else here checks. Not gofumpt: its extra rules would rewrite a large
# fraction of the tree and collide with in-flight branches.
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
